    <!-- Suppress benign Vite WebSocket / HMR connection warnings in preview and iframe environments -->
    <script>
      (function() {
        function isWsError(err) {
          if (!err) return false;
          var str = '';
          if (typeof err === 'string') {
            str = err;
          } else if (err.message) {
            str = err.message;
          } else if (err.reason) {
            str = typeof err.reason === 'string' ? err.reason : (err.reason.message || String(err.reason));
          } else {
            str = String(err);
          }
          str = str.toLowerCase();
          return str.includes('websocket') || str.includes('failed to connect') || str.includes('closed without opened');
        }
        window.addEventListener('unhandledrejection', function(event) {
          if (isWsError(event.reason)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
        window.addEventListener('error', function(event) {
          if (isWsError(event.error) || isWsError(event.message)) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
